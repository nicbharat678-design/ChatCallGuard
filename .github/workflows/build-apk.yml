name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK banao
        run: gradle assembleDebug --no-daemon

      - name: APK download ke liye upload karo
        uses: actions/upload-artifact@v4
        with:
          name: ChatCallGuard-apk
          path: app/build/outputs/apk/debug/*.apk

  # Har screen ki photo — design dekhne ke liye (APK pe asar nahi)
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Screens ki photo banao
        run: gradle recordPaparazziDebug --no-daemon

      - name: Photos upload karo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatCallGuard-screenshots
          path: app/src/test/snapshots/images/

      # Photos 'screenshots' branch pe bhi rakho, taaki GitHub pe seedhe dekh sako
      - name: Photos 'screenshots' branch pe rakho
        run: |
          mkdir -p /tmp/shots
          cp app/src/test/snapshots/images/*.png /tmp/shots/
          cd /tmp/shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Screens ki photo (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
